services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
    volumes:
      - seatlock_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock -d seatlock"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "55432:5432"

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/seatlock
      DB_USERNAME: seatlock
      DB_PASSWORD: seatlock
      ALLOWED_ORIGIN: http://localhost:5173
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  seatlock_data:
