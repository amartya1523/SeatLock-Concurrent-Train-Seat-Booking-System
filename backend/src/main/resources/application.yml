spring:
  application:
    name: seatlock
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seatlock}
    username: ${DB_USERNAME:seatlock}
    password: ${DB_PASSWORD:seatlock}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

seatlock:
  lock-duration: ${LOCK_DURATION:PT2M}
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}

management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
