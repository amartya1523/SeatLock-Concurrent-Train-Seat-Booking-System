services:
  - type: web
    runtime: docker
    name: seatlock-api
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: callmatch-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: callmatch-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: callmatch-db
          property: password
      - key: DB_SCHEMA
        value: seatlock
      - key: DB_POOL_SIZE
        value: 10
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: seatlock-web
          property: host

  - type: web
    runtime: static
    name: seatlock-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: seatlock-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
