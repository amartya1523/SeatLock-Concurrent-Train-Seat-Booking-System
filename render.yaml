services:
  - type: web
    runtime: docker
    name: seatlock-api
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: bash -c 'export DB_URL="jdbc:${DATABASE_URL}"; exec java -jar app.jar'
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seatlock-database
          property: connectionString
      - key: DB_POOL_SIZE
        value: 10
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: seatlock-web
          property: host

  - type: web
    runtime: static
    name: seatlock-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: seatlock-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: seatlock-database
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: seatlock
    user: seatlock
    ipAllowList: []
